name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build
        run: cargo build --release

      - name: Rename artifact
        run: cp target/wasm32-wasip1/release/zellij-keymap.wasm zellij_keymap.wasm

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: zellij_keymap.wasm
          generate_release_notes: true
